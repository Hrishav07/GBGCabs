<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Baby Go Cabs — Powering India's Green Mobility Revolution</title>
    <!-- Official GBG Cabs Logo Favicon in Browser Title Bar -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#EF6C1E" />
    <meta name="description" content="Go Baby Go Cabs — Powering India's Green Mobility Revolution. Sustainable Electric Commercial Fleet Solutions & Multi-Brand EV Ecosystem." />
    <link rel="stylesheet" href="/loader.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              heading: ['Syne', '"Space Grotesk"', 'sans-serif'],
              syne: ['Syne', 'sans-serif'],
              space: ['"Space Grotesk"', 'sans-serif'],
              jakarta: ['"Plus Jakarta Sans"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Google Fonts: Syne, Space Grotesk, Plus Jakarta Sans, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Pre-hydration Theme Initializer (prevents theme flash) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('gbg_theme') || 'dark';
          var root = document.documentElement;
          if (t === 'light') {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            root.style.backgroundColor = '#F8FAFC';
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
            root.style.backgroundColor = '#090D14';
          }
        } catch(e) {}
      })();
    </script>

    <!-- Silky-Smooth Hardware-Accelerated Theme Transition (View Transitions API) -->
    <style>
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }
      ::view-transition-old(root) {
        z-index: 1;
      }
      ::view-transition-new(root) {
        z-index: 9999;
      }

      /* Silky-smooth crossfade fallback if clip-path is not supported or reduced-motion is requested */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation-duration: 0.01ms !important;
        }
      }

      :root {
        --font-heading: 'Syne', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-body: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      html, body, button, input, textarea, select {
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: var(--font-heading);
        letter-spacing: -0.02em;
      }

      html {
        color-scheme: dark;
        background-color: #090D14;
      }
      html.light {
        color-scheme: light;
        background-color: #F8FAFC;
      }
      body {
        margin: 0;
        background-color: inherit;
      }

      /* Clean scrollbar suppression utility for carousels and tab tracks */
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
    </style>
  </head>
  <body class="bg-inherit">
    <div id="root">
      <div id="initial-loader" class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-title">GoBabyGo Cabs</div>
        <div class="initial-loader-subtitle">Connecting India's Green Mobility Fleet...</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div class="loader-error-box">' +
            '<div class="loader-error-title">GBG Cabs Display Notice</div>' +
            '<div class="loader-error-desc">The browser is updating the interface modules. Please perform a quick refresh.</div>' +
            '<button onclick="location.reload()" class="loader-error-btn">Refresh Page</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
